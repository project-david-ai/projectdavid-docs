server {
    listen 80;
    server_name docs.projectdavid.co.uk;

    root  /usr/share/nginx/html;
    index index.html;

    location /markdown/ {
        types { text/plain md; application/json json; }
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}